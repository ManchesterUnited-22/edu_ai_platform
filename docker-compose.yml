services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edu
      POSTGRES_PASSWORD: edu
      POSTGRES_DB: edu_ai
    ports: ["5433:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]

  chroma:
    image: chromadb/chroma:latest
    ports: ["8001:8000"]
    volumes: ["./data/chroma:/chroma/chroma"]

  neo4j:
    image: neo4j:5
    profiles: ["graph"]   # chỉ chạy khi: docker compose --profile graph up
    environment:
      NEO4J_AUTH: neo4j/edu_password
    ports: ["7474:7474", "7687:7687"]
    volumes: ["./data/neo4j:/data"]

  backend:
    build: ./backend
    env_file: .env
    depends_on: [postgres, chroma]
    ports: ["8000:8000"]
    volumes: ["./data/uploads:/app/data/uploads"]
    environment:
      UPLOAD_DIR: /app/data/uploads
    
  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["5173:5173"]
